<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Portfolio Risk Copilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark">P</span>
    <h1>Portfolio Risk Copilot</h1>
  </div>
</div>

<div class="auth-page">
  <div class="card">
    <div class="card-header"><h2>Set a new password</h2></div>

    <form id="reset-password-form">
      <div class="field">
        <label for="reset-new-password">New password</label>
        <input type="password" id="reset-new-password" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary btn-block">Reset password</button>
    </form>

    <p id="reset-error" class="alert alert-error"></p>
    <p id="reset-success" class="alert alert-success"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
