<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Risk Copilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark">P</span>
    <h1>Portfolio Risk Copilot</h1>
  </div>
</div>

<div class="auth-page">
  <div class="card">
    <a href="#" id="google-login-link" class="btn-secondary btn-block" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">
      Sign in with Google
    </a>
    <div style="text-align: center; color: var(--muted); font-size: 0.8rem; margin: 14px 0;">or</div>

    <div id="auth-tabs">
      <button type="button" class="btn-tab active" id="tab-login">Login</button>
      <button type="button" class="btn-tab" id="tab-register">Register</button>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary btn-block">Log in</button>
      <p style="margin: 10px 0 0;"><a href="#" id="forgot-password-link" style="font-size: 0.85rem;">Forgot password?</a></p>
    </form>

    <form id="register-form" style="display: none;">
      <div class="field">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary btn-block">Create account</button>
    </form>

    <form id="forgot-password-form" style="display: none;">
      <p class="card-subtitle">Enter your email and we'll send you a reset link.</p>
      <div class="field">
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary btn-block">Send reset link</button>
      <p style="margin: 10px 0 0;"><a href="#" id="back-to-login-link" style="font-size: 0.85rem;">Back to login</a></p>
    </form>

    <p id="auth-message" class="alert alert-error"></p>
    <p id="auth-success" class="alert alert-success"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
